name: publish-image

# Tags ONLY — deliberately not `branches: [main]`.
#
# Triggering on both builds a release commit twice: once when the release PR
# merges, once when the bot tags that same commit. Both runs emit sha-<short>,
# which then lands on whichever finished last — nondeterminism in the one tag
# whose purpose is identifying an exact build.
#
# Tag-only gives one build per release, every tag written exactly once, and
# sha-<short> sharing a digest with the version tags. The cost is no image for
# commits that are never released.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # No `type=raw,value=latest` rule. The old workflow had one with no
          # condition at all, so latest moved on every push to main whether or
          # not anything was released. metadata-action's default
          # `flavor: latest=auto` sets latest on non-prerelease semver tags,
          # which is what latest should mean.
          #
          # Do NOT add enable={{is_default_branch}} to the sha rule: this
          # workflow only runs on tags, so that condition is always false and
          # sha-<short> would never be emitted at all — silently.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
