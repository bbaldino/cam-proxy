name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize runs so a post-merge run cannot race the run that spawned it.
# cancel-in-progress MUST be false — cancelling mid-release can interrupt
# tag creation.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # NOT the default GITHUB_TOKEN: tags it creates do not trigger
          # publish-image.yml, so the release would silently produce no image.
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Deliberately UNGATED — there is no `if:` here, and adding one back is
      # the bug this replaced. `prs_created` is true only when the PR is
      # *created*, never when it is updated, so a single failed merge poisons
      # the repo permanently: every later push updates the same PR, the step is
      # skipped, and you get green runs, an open release PR, no tag, no image,
      # and nothing reporting a fault. Querying for the PR instead makes this
      # idempotent and self-healing — it recovers on the next push.
      #
      # The title match is a weaker contract than an output read, and that is
      # accepted on purpose. Judge it by how it fails: if the match misses, the
      # release PR stays open and visible and somebody notices. If a stricter
      # gate misses, the run goes green and the release stops silently. This
      # same document rejects title-matching for filtering release commits —
      # same technique, opposite verdict, because there a miss fails invisibly.
      #
      # `--repo` is required: this job has no actions/checkout step (the action
      # is pure API), so `gh` has no git repository to infer the target from and
      # dies with "fatal: not a git repository".
      #
      # `// empty` on the jq matters: without it, no open PR yields the literal
      # string `null`, which then gets passed to `gh pr merge` as a PR number.
      - name: Auto-merge the release PR
        env:
          # Must be RELEASE_BOT_TOKEN. A merge performed with GITHUB_TOKEN does
          # not trigger the follow-up run that cuts the tag — same silent
          # failure as tagging with it.
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          pr=$(gh pr list --repo "${{ github.repository }}" --state open --json number,title \
                --jq 'map(select(.title | test("^chore(\\(.+\\))?: release "))) | .[0].number // empty')
          if [ -z "$pr" ]; then echo "no open release PR"; exit 0; fi
          gh pr merge --squash --delete-branch --repo "${{ github.repository }}" "$pr"
